services:
  d2gs:
    build: .
    image: d2gs:1.14d
    container_name: d2gs
    restart: unless-stopped
    # D2GS reports its own IP to d2cs, so it must share the host's network.
    network_mode: host
    env_file: .env
    # Optional: custom d2gs.reg / d2server.ini / d2warden.ini
    # volumes:
    #   - ./config:/config:ro
